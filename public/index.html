<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta
      name="description"
      content="肌肉腿大合成是合成大西瓜风格的下落物理合成小游戏。"
    >
    <title>肌肉腿大合成</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-app">
      <header class="topbar" aria-label="玩家状态">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>肌肉腿大合成</h1>
            <p id="player-name">健腿新秀</p>
          </div>
        </div>

        <dl class="stat-strip">
          <div class="stat-item">
            <dt>本局分数</dt>
            <dd id="score-count">0</dd>
          </div>
          <div class="stat-item coin-stat">
            <dt>金币</dt>
            <dd id="coin-count">0</dd>
          </div>
          <div class="stat-item">
            <dt>最高等级</dt>
            <dd id="max-level">L1</dd>
          </div>
          <div class="stat-item">
            <dt>连击</dt>
            <dd id="combo-count">0x</dd>
          </div>
        </dl>
      </header>

      <section class="game-layout">
        <section class="arena panel" aria-labelledby="arena-title">
          <div class="next-ball-preview" aria-label="下一个球">
            <i id="next-preview" aria-hidden="true"></i>
            <strong id="next-label">L1</strong>
          </div>
          <button class="menu-fab" id="open-menu" type="button" aria-label="打开菜单">
            <span aria-hidden="true">☰</span>
          </button>

          <div class="arena-head">
            <div>
              <p class="eyebrow">Suika Style</p>
              <h2 id="arena-title">合成场</h2>
            </div>
            <div class="arena-tools" aria-label="本局操作">
              <button class="command-button" id="drop-leg" type="button">落下</button>
              <button class="icon-button" id="pause-game" type="button" aria-label="暂停">
                <span aria-hidden="true">Ⅱ</span>
              </button>
              <button class="icon-button" id="new-round" type="button" aria-label="新一局">
                <span aria-hidden="true">↻</span>
              </button>
            </div>
          </div>

          <div class="status-bar">
            <span id="run-status">准备投放</span>
            <strong id="danger-status">稳定</strong>
          </div>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>

          <div class="canvas-shell">
            <canvas
              id="game-canvas"
              width="420"
              height="900"
              aria-label="合成大西瓜风格肌肉腿物理场"
            ></canvas>
            <div class="game-over" id="game-over" hidden>
              <strong id="game-over-title">本局结束</strong>
              <p id="game-over-reason">球越过死亡线</p>
              <span id="final-score">0 分</span>
              <div class="revive-ad" id="revive-ad">
                <img src="assets/ads/revive_ad_qrcode.png" alt="扫码复活广告位">
                <p>扫码查看广告位，点击复活继续本局</p>
              </div>
              <button class="command-button" id="revive-round" type="button">观看广告复活</button>
              <button class="command-button secondary" id="exit-round" type="button">退出游戏</button>
              <button class="command-button" id="restart-round" type="button">再来一局</button>
            </div>
          </div>
        </section>

        <nav class="bottom-dock" aria-label="功能入口">
          <button class="dock-button" id="open-tasks" type="button" data-panel="tasks">
            <span aria-hidden="true">✓</span>
            <strong>任务</strong>
            <em id="task-badge">0/0</em>
          </button>
          <button class="dock-button" id="open-catalog" type="button" data-panel="catalog">
            <span aria-hidden="true">▦</span>
            <strong>图鉴</strong>
            <em id="catalog-badge">0</em>
          </button>
          <button class="dock-button" id="open-leaderboard" type="button" data-panel="leaderboard">
            <span aria-hidden="true">#</span>
            <strong>排行</strong>
            <em>Top</em>
          </button>
          <button class="dock-button" id="open-share" type="button" data-panel="share">
            <span aria-hidden="true">↗</span>
            <strong>分享</strong>
            <em>奖励</em>
          </button>
        </nav>
      </section>
    </main>

    <div class="modal-overlay" id="panel-modal" hidden>
      <button class="modal-scrim" id="modal-scrim" type="button" aria-label="关闭弹窗"></button>
      <section class="utility-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-head">
          <h2 id="modal-title">任务</h2>
          <button class="icon-button" id="modal-close" type="button" aria-label="关闭">
            <span aria-hidden="true">×</span>
          </button>
        </header>
        <div class="modal-body" id="modal-body"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
